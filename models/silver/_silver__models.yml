version: 2

models:
  - name: slv_rlcs__group_types
    description: "Tipos de nivel del árbol de competición (season, split, tournament...). Viene de la seed group_types."
    columns:
      - name: group_type_id
        description: "Identificador del tipo de nivel"
        data_tests:
          - unique
          - not_null
      - name: group_type_name
        description: "Nombre del tipo de nivel"
        data_tests:
          - not_null

  - name: slv_rlcs__maps
    description: "Mapas en los que se ha jugado alguna partida, con su nombre real."
    columns:
      - name: map_code
        description: "Código interno del mapa"
        data_tests:
          - unique
          - not_null
      - name: map_name
        description: "Nombre real del mapa (de la seed map_names)"
        data_tests:
          - not_null

  - name: slv_rlcs__cars
    description: "Coches usados por los jugadores."
    columns:
      - name: car_id
        description: "Identificador del coche"
        data_tests:
          - unique
          - not_null
      - name: car_name
        description: "Nombre del coche (Octane, Fennec...)"

  - name: slv_rlcs__playlists
    description: "Listas de juego de las partidas (private = online, local-lobby = presencial/LAN)."
    columns:
      - name: playlist_id
        description: "Identificador de la lista de juego"
        data_tests:
          - unique
          - not_null
      - name: match_type
        description: "Tipo de partida (Private o Lan)"

  - name: slv_rlcs__game_seasons
    description: "Temporadas del juego en las que se jugaron las partidas."
    columns:
      - name: season
        description: "Número de temporada del juego"
        data_tests:
          - unique
          - not_null
      - name: season_type
        description: "Tipo de temporada del juego (legacy o free2play)"

  - name: slv_rlcs__teams
    description: "Equipos que participan en la rlcs."
    columns:
      - name: team_id
        description: "Id del equipo generado a traves de su nombre"
        data_tests:
          - unique
          - not_null
      - name: team_name
        description: "Nombre del equipo que participa en la rlcs."
        data_tests:
          - not_null

  - name: slv_rlcs__players
    description: "Jugadores de la rlcs."
    columns:
      - name: player_id
        description: "Id del jugador creado a traves de su plataforma y su id de plataforma"
        data_tests:
          - unique 
          - not_null
      - name: player_platform
        description: "Plataforma del jugador."
        data_tests:
          - not_null
      - name: player_platform_id
        description: "Id de la plataforma del jugador."
        data_tests:
          - not_null
      - name: player_name
        description: "Nombre más reciente del jugador (SCD tipo 1: si cambió de nombre, se guarda el último que usó), 2 jugadores tienen partidas sin nombre; se usa el último nombre conocido."
        data_tests:
          - not_null

  - name: slv_rlcs__match_teams
    description: "Equipos por partido, tabla puente de equipos y partidos"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['match_id', 'team_color']
    columns:
      - name: match_id
        description: "Id del partido, es replay_id renombrado"
        data_tests:
          - not_null
      - name: team_color
        description: "Color del equipo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['blue', 'orange']
      - name: team_id
        description: "Id del equipo, FK a slv_rlcs__teams"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rlcs__teams')
                field: team_id

  - name: slv_rlcs__matches
    description: "Una fila por partida (solo partidas 3v3 válidas del int_). Datos generales de la partida y sus claves foráneas."
    columns:
      - name: match_id
        description: "Identificador de la partida (replay_id de ballchasing renombrado). PK"
        data_tests:
          - unique
          - not_null
      - name: group_id
        description: "Serie a la que pertenece la partida (leaf_group_id renombrado). FK a slv_rlcs__competition_groups"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rlcs__competition_groups')
                field: group_id
      - name: playlist_id
        description: "Lista de juego (private = online, local-lobby = LAN). FK a slv_rlcs__playlists"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rlcs__playlists')
                field: playlist_id
      - name: season
        description: "Temporada del juego. FK a slv_rlcs__game_seasons"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rlcs__game_seasons')
                field: season
      - name: map_code
        description: "Código del mapa. FK a slv_rlcs__maps"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rlcs__maps')
                field: map_code
      - name: title
        description: "Título del replay tal como se subió (suele incluir equipos y número de partida)"
      - name: match_date
        description: "Fecha y hora de la partida (sin zona horaria fiable)"
        data_tests:
          - not_null
      - name: date_has_timezone
        description: "Indica si la fecha original traía zona horaria"
      - name: duration
        description: "Duración de la partida en segundos"
        data_tests:
          - not_null
      - name: overtime_seconds
        description: "Segundos de prórroga. Vacío si la partida no llegó a la prórroga"
      - name: visibility
        description: "Visibilidad del replay en ballchasing (public, unlisted...)"
      - name: is_valid
        description: "Indica si la partida es válida para el análisis. Falso si es corta (< 5 min), tiene un abandono (> 30 s fuera), los goles no cuadran o hay empate. Ver int_rlcs__match_validity"
        data_tests:
          - not_null
  
  - name: slv_rlcs__match_players
    description: >
      Un jugador en una partida (entidad asociativa entre partidas y jugadores).
      Guarda lo que hizo cada jugador en cada partida. Solo estadísticas no derivables:
      los porcentajes y valores por minuto se calculan en gold. Si un jugador se reconectó
      (2 filas en la misma partida), se queda el tramo más largo.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - match_id
              - player_id
    columns:
      - name: match_id
        description: "Identificador de la partida (replay_id de ballchasing)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rlcs__matches')
                field: match_id
      - name: player_id
        description: "Clave del jugador (hash de plataforma + id de plataforma)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('slv_rlcs__players')
                field: player_id
      - name: team_color
        description: "Lado del equipo del jugador en la partida"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['blue', 'orange']
      - name: car_id
        description: "Coche usado. Vacío en 2 filas sin dato de coche"
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_rlcs__cars')
                field: car_id
      - name: start_time
        description: "Segundo de la partida en que el jugador empezó a jugar"
      - name: end_time
        description: "Segundo de la partida en que el jugador dejó de jugar"

      # core
      - name: core_shots
        description: "Tiros a puerta del jugador"
      - name: core_goals
        description: "Goles marcados por el jugador"
      - name: core_saves
        description: "Paradas del jugador"
      - name: core_assists
        description: "Asistencias del jugador"
      - name: core_score
        description: "Puntuación del jugador en la partida"
      - name: core_mvp
        description: "Indica si el jugador fue el MVP de la partida"

      # boost
      - name: boost_bpm
        description: "Boost consumido por minuto (no derivable: no hay boost gastado total)"
      - name: boost_avg_amount
        description: "Cantidad media de boost que tenía el jugador (0-100)"
      - name: boost_amount_collected
        description: "Cantidad total de boost recogido"
      - name: boost_amount_stolen
        description: "Cantidad de boost recogido en el campo rival"
      - name: boost_amount_collected_big
        description: "Boost recogido en pads grandes"
      - name: boost_amount_stolen_big
        description: "Boost recogido en pads grandes del campo rival"
      - name: boost_amount_collected_small
        description: "Boost recogido en pads pequeños"
      - name: boost_amount_stolen_small
        description: "Boost recogido en pads pequeños del campo rival"
      - name: boost_count_collected_big
        description: "Número de pads grandes recogidos"
      - name: boost_count_stolen_big
        description: "Número de pads grandes recogidos en el campo rival"
      - name: boost_count_collected_small
        description: "Número de pads pequeños recogidos"
      - name: boost_count_stolen_small
        description: "Número de pads pequeños recogidos en el campo rival"
      - name: boost_amount_overfill
        description: "Boost desperdiciado al recoger pads con el depósito casi lleno"
      - name: boost_amount_overfill_stolen
        description: "Boost desperdiciado al recoger pads del campo rival con el depósito casi lleno"
      - name: boost_amount_used_while_supersonic
        description: "Boost gastado yendo ya a velocidad supersónica"
      - name: boost_time_zero_boost
        description: "Segundos con el depósito de boost vacío"
      - name: boost_time_full_boost
        description: "Segundos con el depósito de boost lleno"
      - name: boost_time_boost_0_25
        description: "Segundos con entre 0 y 25 de boost"
      - name: boost_time_boost_25_50
        description: "Segundos con entre 25 y 50 de boost"
      - name: boost_time_boost_50_75
        description: "Segundos con entre 50 y 75 de boost"
      - name: boost_time_boost_75_100
        description: "Segundos con entre 75 y 100 de boost"

      # movimiento
      - name: mv_avg_speed
        description: "Velocidad media del jugador (unidades del juego)"
      - name: mv_total_distance
        description: "Distancia total recorrida (unidades del juego)"
      - name: mv_time_supersonic_speed
        description: "Segundos a velocidad supersónica"
      - name: mv_time_boost_speed
        description: "Segundos a velocidad de boost"
      - name: mv_time_slow_speed
        description: "Segundos a velocidad lenta"
      - name: mv_time_ground
        description: "Segundos en el suelo"
      - name: mv_time_low_air
        description: "Segundos en el aire a poca altura"
      - name: mv_time_high_air
        description: "Segundos en el aire a mucha altura"
      - name: mv_time_powerslide
        description: "Segundos derrapando (powerslide)"
      - name: mv_count_powerslide
        description: "Número de derrapes (powerslide)"

      # posicionamiento
      - name: pos_avg_distance_to_ball
        description: "Distancia media a la pelota"
      - name: pos_avg_distance_to_ball_possession
        description: "Distancia media a la pelota cuando su equipo tiene la posesión"
      - name: pos_avg_distance_to_ball_no_possession
        description: "Distancia media a la pelota cuando el rival tiene la posesión"
      - name: pos_avg_distance_to_mates
        description: "Distancia media a sus compañeros de equipo"
      - name: pos_time_defensive_third
        description: "Segundos en el tercio defensivo del campo"
      - name: pos_time_neutral_third
        description: "Segundos en el tercio central del campo"
      - name: pos_time_offensive_third
        description: "Segundos en el tercio ofensivo del campo"
      - name: pos_time_defensive_half
        description: "Segundos en la mitad defensiva del campo"
      - name: pos_time_offensive_half
        description: "Segundos en la mitad ofensiva del campo"
      - name: pos_time_behind_ball
        description: "Segundos por detrás de la pelota (entre la pelota y su portería). Base del caso estrella"
      - name: pos_time_infront_ball
        description: "Segundos por delante de la pelota"
      - name: pos_time_most_back
        description: "Segundos siendo el jugador más retrasado de su equipo"
      - name: pos_time_most_forward
        description: "Segundos siendo el jugador más adelantado de su equipo"
      - name: pos_time_closest_to_ball
        description: "Segundos siendo el jugador de su equipo más cercano a la pelota"
      - name: pos_time_farthest_from_ball
        description: "Segundos siendo el jugador de su equipo más lejano a la pelota"
      - name: pos_goals_against_while_last_defender
        description: "Goles encajados siendo último defensor (vacío convertido a 0 en staging)"

      # demoliciones
      - name: demo_inflicted
        description: "Demoliciones que hizo el jugador"
      - name: demo_taken
        description: "Demoliciones que sufrió el jugador"

  - name: slv_rlcs__competition_groups
    description: >
      Árbol de competición: un grupo de ballchasing por fila (temporada, split, región,
      torneo, fase, ronda o serie), con su grupo padre. Se construye troceando las rutas
      group_id_path y group_path. Las rutas tienen de 3 a 9 niveles y cada nivel no significa
      lo mismo en cada temporada, así que el tipo solo se asigna cuando es seguro
      (temporada, región y serie); el resto queda vacío.
    columns:
      - name: group_id
        description: "Identificador del grupo en ballchasing"
        data_tests:
          - unique
          - not_null
      - name: group_name
        description: "Nombre del grupo tal como viene en ballchasing (puede llevar un prefijo [n])"
        data_tests:
          - not_null
      - name: parent_group_id
        description: "Grupo padre (el trozo anterior de la ruta). Vacío en las temporadas (raíz)"
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_rlcs__competition_groups')
                field: group_id
      - name: group_level
        description: "Profundidad en el árbol (0 = temporada)"
        data_tests:
          - not_null
      - name: group_type_id
        description: >
          Tipo de grupo: 1 season (nivel 0), 7 series (grupo sin hijos), 4 region (lista cerrada
          de regiones). Vacío cuando no se puede identificar con seguridad (fases, rondas, torneos)
          Hay 2 grupos (una ronda y una fase) que tienen hijos y además 4 partidas colgando
          directamente, por un error de subida en ballchasing: se quedan sin tipo y esas
          4 partidas no tienen serie.
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_rlcs__group_types')
                field: group_type_id      
